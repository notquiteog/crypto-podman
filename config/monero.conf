data-dir=/data
confirm-external-bind=1
# Protocol-supported pruning; it preserves full validation but retains less
# historical block data.  Use it from the initial sync for actual disk savings.
prune-blockchain=1
sync-pruned-blocks=1
# Favor database durability over initial-sync speed, including after power loss.
db-sync-mode=safe:sync

# monerod's general proxy accepts SOCKS4; Arti accepts SOCKS4/4a/5.
p2p-bind-ip=127.0.0.1
proxy=10.89.0.10:9150
tx-proxy=tor,10.89.0.10:9150,12,disable_noise
no-igd=1
hide-my-port=1

# Expose only the restricted API to Arti's private bridge.
rpc-bind-ip=127.0.0.1
rpc-bind-port=18081
rpc-restricted-bind-ip=0.0.0.0
rpc-restricted-bind-port=18089
rpc-max-connections=25
rpc-max-connections-per-private-ip=25
rpc-ssl=disabled
disable-rpc-ban=1
no-zmq=1

# monerod's console output already reaches journald through the unit, and it
# additionally writes its own log into the data directory -- by default about
# 100 MB per file across 50 files, on the chain that consumes the most disk.
max-log-file-size=10485760
max-log-files=3
