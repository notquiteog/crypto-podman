datadir=/data
server=1
daemon=0
walletdir=/data/wallets
# Automatic prune target (MiB) for raw block and undo files.  Litecoin's blocks
# are far smaller than Bitcoin's, so the same 10000 MiB (~10 GB) target retains
# several months of history rather than one, bounding how far a wallet rescan
# can reach.  Chainstate and indexes are separate and consume additional disk.
prune=10000
txindex=0

# Unlike Bitcoin and Monero, Litecoin cannot bootstrap over Tor: exit relays
# reject port 9333, and the three onion addresses compiled into Litecoin Core
# are unreachable, so an onion-only node never finds a peer and never syncs.
# It therefore peers over the clearnet.  It still makes no inbound connections,
# and its RPC remains reachable only through the authenticated onion service.
listen=0
discover=0
upnp=0
natpmp=0

rpcbind=0.0.0.0
# Arti's egress-bridge address, not the whole subnet; see bitcoin.conf.
rpcallowip=10.89.1.10
rpcport=9332
rpcthreads=4
rpcworkqueue=32
rpcservertimeout=30
includeconf=/etc/litecoin/rpcauth.conf
