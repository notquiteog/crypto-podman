datadir=/data
server=1
daemon=0
walletdir=/data/wallets
# Automatic prune target (MiB) for raw block and undo files.  Litecoin's blocks
# are far smaller than Bitcoin's, so the same 10000 MiB (~10 GB) target retains
# several months of history rather than one, bounding how far a wallet rescan
# can reach.  Chainstate and indexes are separate and consume additional disk.
prune=10000
txindex=0

# Every outbound connection, and every DNS-seed lookup, goes through Arti's
# SOCKS proxy.  Peers are NOT restricted to onion: there is no onlynet line, so
# Litecoin also reaches clearnet peers, through Tor exit relays.  That matters
# here because port 9333 is not in Tor's reduced exit policy, so the pool of
# usable exits is smaller than Bitcoin's -- see the README.
proxy=10.89.0.10:9150
listen=0
discover=0
upnp=0
natpmp=0

rpcbind=0.0.0.0
# Arti's address on the internal bridge; see bitcoin.conf.
rpcallowip=10.89.0.10
rpcport=9332
rpcthreads=4
rpcworkqueue=32
rpcservertimeout=30
includeconf=/etc/litecoin/rpcauth.conf
