wallet-file=/wallets/default
password-file=/etc/monero-wallet/wallet-password
daemon-address=http://10.89.0.13:18089
trusted-daemon=1

# This full wallet API can send funds.  It is reached only through its separate
# Arti onion service and requires the rpc-login appended by setup.sh.
# monero-wallet-rpc has no per-IP allowlist, unlike the two Core daemons, so
# this cannot be narrowed the way their rpcallowip lines are.  Everything on
# the internal bridge -- which includes bitcoind -- can therefore reach this
# port and attempt its digest auth.  See the README's security posture.
rpc-bind-ip=0.0.0.0
rpc-bind-port=18088
confirm-external-bind=1
rpc-max-connections=10
rpc-max-connections-per-private-ip=10
rpc-ssl=disabled
disable-rpc-ban=1
