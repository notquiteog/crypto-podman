datadir=/data
server=1
daemon=0
walletdir=/data/wallets
# Automatic prune target (MiB) for raw block and undo files.  Core's minimum is
# 550, which reaches back barely a day; 10000 MiB (~10 GB) retains roughly a
# month of Bitcoin history, and a wallet rescan can reach no further back than
# that.  Chainstate and indexes are separate and consume additional disk.
prune=10000
txindex=0

# Every outbound connection and DNS-seed lookup goes through Arti's SOCKS
# proxy, so nothing leaves this host outside Tor.  Peers are deliberately NOT
# restricted to onion -- there is no onlynet line -- so Core also reaches
# clearnet peers through Tor exit relays, which is a far larger and healthier
# peer set.  The tradeoff is that Bitcoin's v1 P2P transport is unencrypted, so
# an exit relay can observe that traffic; it still cannot see this host's IP.
listen=0
proxy=10.89.0.10:9150
discover=0
upnp=0
natpmp=0

rpcbind=0.0.0.0
# Arti's internal-bridge address, not the whole subnet: it is the only thing
# that should ever reach this RPC.  Loopback is always permitted by Core in
# addition to this, which is what the container's own health check uses.
rpcallowip=10.89.0.10
rpcport=8332
rpcthreads=4
rpcworkqueue=32
rpcservertimeout=30
includeconf=/etc/bitcoin/rpcauth.conf
