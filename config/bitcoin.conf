datadir=/data
server=1
daemon=0
disablewallet=1
# Minimum automatic prune target (MiB) for raw block and undo files.  Chainstate
# and indexes remain necessary to validate the chain and consume additional disk.
prune=550
txindex=0

# No clearnet P2P or host-published RPC; all outgoing peers use Arti SOCKS.
listen=0
onlynet=onion
proxy=arti:9150
# Keep DNS seeding enabled: with -proxy, Core resolves it through SOCKS.
# onlynet=onion still rejects non-onion peers.
discover=0
upnp=0
natpmp=0

rpcbind=0.0.0.0
rpcallowip=10.89.0.0/24
rpcport=8332
rpcthreads=4
rpcworkqueue=32
rpcservertimeout=30
includeconf=/etc/bitcoin/rpcauth.conf
